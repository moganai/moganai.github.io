<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoganOCR · Belge Gönder</title>
<meta name="description" content="OCR'da zorlandığınız belgeleri gönderin; MoganOCR-TR'nin bir sonraki sürümünü bu belgelere benzeyen verilerle eğitelim.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --krem:#EDE4D3; --krem-koyu:#E2D6BF; --krem-acik:#F6F1E7; --zemin:#FBF8F2; --kart:#FFFFFF;
  --lacivert:#152B66; --lacivert-2:#223F8F; --lacivert-3:#4A6CC4;
  --yesil:#0D4A2C; --yesil-2:#156B40; --yesil-3:#2E9E66;
  --kiremit:#B4543B; --hardal:#D3A84F;
  --metin:#1B2233; --soluk:#5D6474; --silik:#A39B8C; --cizgi:#E6DED0; --cizgi-acik:#F1ECE2;
  --baslik:"Space Grotesk",system-ui,sans-serif;
  --govde:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--zemin);color:var(--metin);font:16px/1.6 var(--govde);-webkit-font-smoothing:antialiased}
body.kilit{overflow:hidden}
a{color:var(--lacivert-2)}
.kap{max-width:1120px;margin:0 auto;padding:0 24px}
@media (max-width:640px){.kap{padding:0 16px}}
:focus-visible{outline:2px solid var(--lacivert-3);outline-offset:2px}

/* ---------- üst çubuk ---------- */
.ust{position:sticky;top:0;z-index:20;background:rgba(237,228,211,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--krem-koyu)}
.ust .kap{display:flex;align-items:center;gap:20px;height:60px}
.marka{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 18px var(--baslik);letter-spacing:-.01em}
.marka svg{width:30px;height:26px}
.marka .t1{color:var(--lacivert)} .marka .t2{color:var(--yesil)}
.ust nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.ust nav a{color:var(--lacivert);text-decoration:none;font:500 14px var(--govde);padding:6px 12px}
.ust nav a:hover{background:var(--krem-koyu)}
.ust nav a.dis{border:1px solid var(--lacivert);margin-left:6px}
@media (max-width:760px){.ust nav a:not(.dis){display:none}}
.dil{display:inline-flex;border:1px solid var(--lacivert);margin-left:8px}
.dil button{font:600 12px var(--mono);background:transparent;color:var(--lacivert);border:0;padding:5px 9px;cursor:pointer}
.dil button+button{border-left:1px solid var(--lacivert)}
.dil button.secili{background:var(--lacivert);color:#fff}

/* ---------- kahraman bant ---------- */
.bant{background:var(--krem);position:relative;overflow:hidden;border-bottom:1px solid var(--krem-koyu)}
.bant .kap{position:relative;padding-top:72px;padding-bottom:64px}
.bant .desen{position:absolute;right:-60px;top:-30px;width:620px;height:auto;opacity:.95;pointer-events:none}
@media (max-width:900px){.bant .desen{opacity:.25;right:-200px}}
.kelime-isareti{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.kelime-isareti svg{width:86px;height:74px;flex:none}
.kelime-isareti h1{margin:0;font:700 clamp(40px,6.4vw,76px)/1 var(--baslik);letter-spacing:-.025em}
.kelime-isareti .t1{color:var(--lacivert)} .kelime-isareti .t2{color:var(--yesil)}
.slogan{max-width:580px;margin:26px 0 0;font-size:19px;line-height:1.5;color:#2b3350}
.slogan b{color:var(--lacivert);font-weight:600}
.ust-uyari{max-width:620px;margin:26px 0 0;background:var(--krem-acik);border:1px solid var(--krem-koyu);padding:18px 20px}
.ust-uyari .ust-satir{display:flex;align-items:center;gap:10px}
.ust-uyari .kup{width:20px;height:20px;flex:none}
.ust-uyari h3{margin:0;font:700 18px var(--baslik);color:var(--lacivert);letter-spacing:-.01em}
.ust-uyari p{margin:8px 0 0;font-size:14.5px;color:#3a4256}
.cipler{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap;max-width:620px}
.cipler span{font:500 14px var(--govde);color:var(--yesil);background:var(--krem-acik);border:1px solid var(--krem-koyu);padding:3px 10px}
.istat{display:flex;gap:0;margin-top:40px;flex-wrap:wrap;max-width:640px}
.istat div{padding:0 26px;border-left:1px solid var(--krem-koyu)}
.istat div:first-child{padding-left:0;border-left:0}
.istat b{display:block;font:700 34px/1.1 var(--baslik);color:var(--lacivert);letter-spacing:-.02em}
.istat span{font-size:13px;color:var(--soluk);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:560px){.istat{gap:18px 28px}.istat div,.istat div:first-child{padding:0;border-left:0}.istat b{font-size:28px}}
.dugmeler{display:flex;gap:10px;margin-top:36px;flex-wrap:wrap}
.dugme{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--govde);padding:11px 20px;text-decoration:none;border:1.5px solid var(--lacivert);cursor:pointer;background:none}
.dugme.dolu{background:var(--lacivert);color:#fff}
.dugme.bos{color:var(--lacivert)}
.dugme:hover{transform:translateY(-1px)}
.dugme[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* ---------- bölüm ---------- */
section{padding:72px 0 0}
.bolum-bas{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.etiket{font:600 12px var(--govde);letter-spacing:.12em;text-transform:uppercase;color:var(--yesil-2)}
h2{margin:6px 0 0;font:700 clamp(26px,3.4vw,34px)/1.15 var(--baslik);letter-spacing:-.02em;color:var(--lacivert)}
.aciklama{color:var(--soluk);max-width:640px;margin:8px 0 0;font-size:15px}
.kart{background:var(--kart);border:1px solid var(--cizgi);box-shadow:0 1px 0 rgba(21,43,102,.03),0 8px 24px -16px rgba(21,43,102,.18)}
.uc{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.uc{grid-template-columns:1fr}}
.bilesen{background:var(--krem-acik);border:1px solid var(--krem-koyu);padding:22px 22px 20px}
.bilesen .ust-satir{display:flex;align-items:center;gap:10px}
.bilesen .kup{width:22px;height:22px;flex:none}
.bilesen h3{margin:0;font:700 20px var(--baslik);color:var(--lacivert)}
.bilesen .no{font:600 13px var(--mono);color:var(--yesil-2);margin-left:auto}
.bilesen p{margin:12px 0 0;font-size:14.5px;color:#3a4256}

/* ---------- form ---------- */
.form-kart{padding:0}
.adim{padding:26px 28px;border-bottom:1px solid var(--cizgi-acik)}
@media (max-width:640px){.adim{padding:20px 16px}}
.adim:last-child{border-bottom:0}
.adim-bas{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.adim-bas b{font:600 13px var(--mono);color:var(--yesil-2);background:var(--krem-acik);border:1px solid var(--krem-koyu);padding:2px 8px}
.adim-bas h3{margin:0;font:700 19px var(--baslik);color:var(--lacivert);letter-spacing:-.01em}
.adim-bas small{color:var(--soluk);font-size:13px}
.birak{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
  border:2px dashed var(--krem-koyu);background:var(--krem-acik);padding:34px 20px;cursor:pointer;transition:border-color .15s,background .15s}
.birak:hover,.birak.uzerinde{border-color:var(--lacivert-3);background:#fff}
.birak svg{width:46px;height:40px}
.birak strong{font:600 16px var(--govde);color:var(--lacivert)}
.birak span{font-size:13px;color:var(--soluk)}
.birak input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.dosyalar{display:grid;gap:10px;margin-top:14px}
.dosyalar:empty{display:none}
.dosya{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:start;border:1px solid var(--cizgi);background:#fff;padding:10px}
.dosya .onizleme{width:72px;height:92px;background:var(--krem-acik);border:1px solid var(--cizgi);display:grid;place-items:center;overflow:hidden}
.dosya .onizleme img{width:100%;height:100%;object-fit:cover}
.dosya .onizleme b{font:600 13px var(--mono);color:var(--kiremit)}
.dosya .ad{font:500 14px var(--govde);color:var(--metin);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dosya .boyut{font:500 12px var(--mono);color:var(--silik)}
.dosya textarea{margin-top:6px;min-height:46px}
.dosya .kaldir{border:1px solid var(--cizgi);background:var(--krem-acik);color:var(--kiremit);font:600 16px var(--govde);width:32px;height:32px;cursor:pointer}
.dosya .kaldir:hover{background:#fff;border-color:var(--kiremit)}
.ozet-satir{display:flex;justify-content:space-between;font:500 12.5px var(--mono);color:var(--soluk);margin-top:8px}
label.alan{display:block;font:600 14px var(--govde);color:var(--metin);margin:0 0 6px}
label.alan small{font-weight:400;color:var(--soluk)}
textarea,select,input[type=text]{width:100%;font:15px/1.5 var(--govde);color:var(--metin);background:#fff;border:1px solid var(--krem-koyu);padding:9px 11px;border-radius:0}
textarea{resize:vertical;min-height:96px}
textarea:focus,select:focus,input[type=text]:focus{outline:none;border-color:var(--lacivert-3);box-shadow:0 0 0 3px rgba(74,108,196,.15)}
.iki-sutun{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:760px){.iki-sutun{grid-template-columns:1fr}}
.secenekler{display:flex;flex-wrap:wrap;gap:8px}
.secenek{position:relative}
.secenek input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.secenek span{display:inline-block;font:500 14px var(--govde);color:var(--lacivert);background:#fff;border:1px solid var(--krem-koyu);padding:6px 12px;cursor:pointer;user-select:none}
.secenek input:checked+span{background:var(--lacivert);border-color:var(--lacivert);color:#fff}
.secenek input:focus-visible+span{outline:2px solid var(--lacivert-3);outline-offset:2px}
.alt-bosluk{margin-top:18px}
details.ek summary{cursor:pointer;font:600 14px var(--govde);color:var(--lacivert-2);margin-top:18px}
details.ek[open] summary{margin-bottom:10px}
.izin{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:#3a4256;margin-bottom:10px;cursor:pointer}
.izin input{margin-top:4px;width:18px;height:18px;accent-color:var(--lacivert);flex:none}
.uyari{font-size:14px;color:#3a4256;background:var(--krem-acik);border:1px solid var(--krem-koyu);padding:12px 16px;margin:0 0 16px}
.uyari b{color:var(--lacivert)}
.bal{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
.gonder-satir{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px}
.sunucu{font:500 13px var(--mono);color:var(--soluk);display:inline-flex;align-items:center;gap:8px}
.sunucu i{width:9px;height:9px;background:var(--silik);display:inline-block}
.sunucu.hazir i{background:var(--yesil-3)} .sunucu.uyaniyor i{background:var(--hardal);animation:nabiz 1s infinite alternate} .sunucu.hata i{background:var(--kiremit)}
@keyframes nabiz{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sunucu.uyaniyor i{animation:none}.dugme:hover{transform:none}}
.ilerleme{height:8px;background:var(--cizgi-acik);border:1px solid var(--cizgi);margin-top:14px;display:none}
.ilerleme{overflow:hidden}
.ilerleme i{display:block;height:100%;width:35%;background:var(--yesil-3);animation:kayan 1.2s ease-in-out infinite}
@keyframes kayan{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
@media (prefers-reduced-motion:reduce){.ilerleme i{animation:none;width:100%;opacity:.5}}
.mesaj{margin-top:14px;font-size:14.5px;display:none;padding:10px 14px;border-left:3px solid}
.mesaj.hata{display:block;color:#7A2E1E;background:#FBEDE8;border-color:var(--kiremit)}
.mesaj.bilgi{display:block;color:var(--yesil);background:#EEF6F0;border-color:var(--yesil-3)}
.basari{display:none;padding:30px 28px}
.basari.acik{display:block}
.basari h3{margin:0 0 6px;font:700 24px var(--baslik);color:var(--yesil)}
.kodlar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
@media (max-width:640px){.kodlar{grid-template-columns:1fr}.basari{padding:20px 16px}}
.kod{background:var(--krem-acik);border:1px solid var(--krem-koyu);padding:12px 14px}
.kod span{display:block;font:600 11px var(--govde);letter-spacing:.08em;text-transform:uppercase;color:var(--soluk)}
.kod div{display:flex;align-items:center;gap:10px;margin-top:4px}
.kod code{font:600 16px var(--mono);color:var(--lacivert);word-break:break-all;flex:1}
.kod button{font:600 12px var(--mono);border:1px solid var(--lacivert);background:#fff;color:var(--lacivert);padding:4px 9px;cursor:pointer}

/* ---------- ikinci bant + SSS ---------- */
.bant-ikinci{background:var(--krem);margin-top:80px;padding:68px 0 72px;border-top:1px solid var(--krem-koyu);border-bottom:1px solid var(--krem-koyu)}
.bant-ikinci section{padding:0}
.sss{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:860px){.sss{grid-template-columns:1fr}}
.sss div{background:var(--krem-acik);border:1px solid var(--krem-koyu);padding:18px 20px}
.sss h3{margin:0 0 6px;font:700 17px var(--baslik);color:var(--lacivert)}
.sss p{margin:0;font-size:14.5px;color:#3a4256}
.sil-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;padding:22px 24px}
@media (max-width:760px){.sil-form{grid-template-columns:1fr;padding:18px 16px}}

footer{margin-top:80px;background:var(--lacivert);color:#C9D2EA}
footer .kap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:28px;padding-bottom:28px;font-size:14px}
footer .marka{color:#fff}
footer .marka .t1{color:#fff} footer .marka .t2{color:#7ED3A4}
footer a{color:#fff}
footer nav{display:flex;gap:18px;flex-wrap:wrap}

/* ---------- aydınlatma paneli ---------- */
.perde{position:fixed;inset:0;background:rgba(21,43,102,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.perde.acik{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--zemin);z-index:41;
  transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s;display:flex;flex-direction:column;visibility:hidden}
.panel.acik{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px -20px rgba(21,43,102,.35)}
.p-bas{background:var(--krem);border-bottom:1px solid var(--krem-koyu);padding:20px 28px;display:flex;align-items:center;gap:16px}
.p-bas h3{margin:0;font:700 24px var(--baslik);color:var(--lacivert);flex:1}
.p-bas button{width:36px;height:36px;border:1px solid var(--krem-koyu);background:var(--krem-acik);color:var(--lacivert);font:600 18px var(--govde);cursor:pointer}
.p-govde{flex:1;overflow-y:auto;padding:24px 28px 56px;font-size:15px;color:#3a4256}
.p-govde h4{margin:22px 0 6px;font:700 17px var(--baslik);color:var(--lacivert)}
.p-govde ul{padding-left:20px;margin:6px 0}
@media (max-width:640px){.p-bas,.p-govde{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>

    <polygon points="22,30.66 36,22.58 50,30.66 50,46.81" fill="#4A6CC4"/>

</svg>

<header class="ust">
  <div class="kap">
    <a class="marka" href="/"><svg><use href="#isaret"/></svg><span><span class="t1">Mogan</span><span class="t2">AI</span></span></a>
    <nav>
      <a href="#nasil" data-i18n="nav.nasil"></a>
      <a href="#gonder" data-i18n="nav.gonder"></a>
      <a href="#sss" data-i18n="nav.sss"></a>
      <a href="#sil" data-i18n="nav.sil"></a>
      <a class="dis" href="https://huggingface.co/moganai/MoganOCR-TR" target="_blank" rel="noopener noreferrer" data-i18n="nav.model"></a>
      <div class="dil" role="group" aria-label="Dil / Language">
        <button type="button" data-dil="tr">TR</button><button type="button" data-dil="en">EN</button>
      </div>
    </nav>
  </div>
</header>

<div class="bant">
  <svg class="desen" viewBox="0 0 620 520" aria-hidden="true" id="desen"></svg>
  <div class="kap">
    <div class="kelime-isareti">
      <svg aria-hidden="true"><use href="#isaret"/></svg>
      <h1><span class="t1">MoganOCR</span><span class="t2">-Topluluk</span></h1>
    </div>
    <p class="slogan" data-i18n="slogan"></p>
    <div class="ust-uyari" role="note">
      <div class="ust-satir"><svg class="kup" aria-hidden="true"><use href="#kup-y"/></svg><h3 data-i18n="ust.uyari.b"></h3></div>
      <p data-i18n="ust.uyari.p"></p>
    </div>
    <div class="cipler" id="cipler"></div>
    <div class="istat" id="istat"></div>
    <div class="dugmeler">
      <a class="dugme dolu" href="#gonder" data-i18n="dugme.gonder"></a>
      <a class="dugme bos" href="https://huggingface.co/moganai/MoganOCR-TR" target="_blank" rel="noopener noreferrer" data-i18n="dugme.model"></a>
      <a class="dugme bos" href="https://huggingface.co/spaces/moganai/TurkishOCR-Bench" target="_blank" rel="noopener noreferrer" data-i18n="dugme.bench"></a>
    </div>
  </div>
</div>

<main class="kap">
  <section id="nasil">
    <div class="bolum-bas"><div>
      <div class="etiket" data-i18n="nasil.etiket"></div>
      <h2 data-i18n="nasil.baslik"></h2>
      <p class="aciklama" data-i18n="nasil.aciklama"></p>
    </div></div>

// ===================== DİL =====================
function ilkDil() {
  const p = ADRES.get("lang");
  if (p === "tr" || p === "en") return p;
  try { const k = localStorage.getItem("tob-dil"); if (k === "tr" || k === "en") return k; } catch (e) {}
  return (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
}
let dil = ilkDil();
const t = k => METIN[dil][k] ?? METIN.tr[k] ?? k;
const kac = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = id => document.getElementById(id);

function boyutYaz(b) {
  const mb = b / 1024 / 1024;
  const s = mb >= 1 ? mb.toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  return dil === "tr" ? s.replace(".", ",") : s;
}

function secenekleriCiz() {
  const tur = document.querySelector("input[name=belge_turu]:checked")?.value || "gercek";
  $("belge-turu").innerHTML = Object.entries(t("belgeTuru")).map(([k, v]) =>
    `<label class="secenek"><input type="radio" name="belge_turu" value="${k}" ${k === tur ? "checked" : ""}><span>${v}</span></label>`).join("");
  const kat = $("kategori").value || "diger";
  $("kategori").innerHTML = Object.entries(t("kategori")).map(([k, v]) => `<option value="${k}" ${k === kat ? "selected" : ""}>${v}</option>`).join("");
  const secili = new Set([...document.querySelectorAll("input[name=sorunlar]:checked")].map(e => e.value));
  $("sorunlar").innerHTML = Object.entries(t("sorun")).map(([k, v]) =>
    `<label class="secenek"><input type="checkbox" name="sorunlar" value="${k}" ${secili.has(k) ? "checked" : ""}><span>${v}</span></label>`).join("");
}

function metinleriYaz() {
  document.documentElement.lang = dil;
  document.querySelectorAll("[data-i18n]").forEach(e => e.innerHTML = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.querySelectorAll(".dil button").forEach(b => b.classList.toggle("secili", b.dataset.dil === dil));
  $("cipler").innerHTML = t("cipler").map(a => `<span>${a}</span>`).join("");
  $("istat").innerHTML = t("istat").map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("");
  $("sss-liste").innerHTML = t("sss").map(([b, p]) => `<div><h3>${b}</h3><p>${p}</p></div>`).join("");
  $("p-govde").innerHTML = t("aydinlatma");
  secenekleriCiz();
  dosyalariCiz();
  sunucuYaz(sunucuDurum);
}

document.querySelectorAll(".dil button").forEach(b => b.onclick = () => {
  dil = b.dataset.dil;
  try { localStorage.setItem("tob-dil", dil); } catch (e) {}
  const u = new URL(location.href); u.searchParams.set("lang", dil);
  history.replaceState(null, "", u.pathname + u.search + u.hash);
  metinleriYaz();
});

let secilenler = []; // {dosya, not, url}

function dosyalariCiz() {
  $("dosyalar").innerHTML = secilenler.map((s, i) => {
    const resim = s.url ? `<img src="${s.url}" alt="">` : `<b>${kac((s.dosya.name.split(".").pop() || "?").toUpperCase())}</b>`;
    return `<div class="dosya"><div class="onizleme">${resim}</div>
      <div><div class="ad" title="${kac(s.dosya.name)}">${kac(s.dosya.name)}</div><div class="boyut">${boyutYaz(s.dosya.size)}</div>
      <textarea data-not="${i}" maxlength="3000" rows="2" placeholder="${kac(t("form.dosya.not.ph"))}">${kac(s.not)}</textarea></div>
      <button type="button" class="kaldir" data-kaldir="${i}" title="${kac(t("form.dosya.kaldir"))}" aria-label="${kac(t("form.dosya.kaldir"))}">✕</button></div>`;
  }).join("");
  const toplam = secilenler.reduce((a, s) => a + s.dosya.size, 0);
  $("ozet-satir").textContent = secilenler.length ? t("form.dosya.ozet").replace("{n}", secilenler.length).replace("{b}", boyutYaz(toplam)) : "";
}

function dosyaEkle(liste) {
  mesajGizle();
  for (const f of liste) {
    if (secilenler.length >= MAKS_DOSYA) { mesajGoster("hata", t("hata").dosya_sayisi); break; }
    if (!TURLER.test(f.name)) { mesajGoster("hata", t("hata").desteklenmeyen_tur); continue; }
    if (f.size > MAKS_DOSYA_BAYT) { mesajGoster("hata", t("hata").dosya_cok_buyuk); continue; }
    if (f.size === 0) { mesajGoster("hata", t("hata").bos_dosya); continue; }
    const onizlenir = /^image\/(jpeg|png|webp)$/.test(f.type);
    secilenler.push({ dosya: f, not: "", url: onizlenir ? URL.createObjectURL(f) : null });
  }
  dosyalariCiz();
}

$("dosya-girdi").addEventListener("change", e => { dosyaEkle([...e.target.files]); e.target.value = ""; });
const birak = $("birak");
["dragenter", "dragover"].forEach(o => birak.addEventListener(o, e => { e.preventDefault(); birak.classList.add("uzerinde"); }));
["dragleave", "drop"].forEach(o => birak.addEventListener(o, e => { e.preventDefault(); birak.classList.remove("uzerinde"); }));
birak.addEventListener("drop", e => dosyaEkle([...e.dataTransfer.files]));
birak.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("dosya-girdi").click(); } });
$("dosyalar").addEventListener("input", e => { const i = e.target.dataset.not; if (i !== undefined) secilenler[+i].not = e.target.value; });
$("dosyalar").addEventListener("click", e => {
  const i = e.target.dataset.kaldir; if (i === undefined) return;
  const [s] = secilenler.splice(+i, 1); if (s.url) URL.revokeObjectURL(s.url);
  dosyalariCiz();
});

function mesajGizle(kutu = "mesaj") { $(kutu).className = "mesaj"; $(kutu).textContent = ""; }

// ===================== ÜST VERİ =====================
// Konum ve cihaz bilgisi gönderilmeden burada silinir: JPEG'de APP1 (EXIF/XMP) ve APP13 parçaları,
// PNG'de eXIf ve metin parçaları atılır; görüntü verisine dokunulmaz. Fotoğrafın yönü (EXIF Orientation)
// silinmeden önce okunup kayda ayrıca yazılır, böylece yan çekilmiş fotoğraflar eğitimde düzeltilebilir.
function jpegParcalari(b, ziyaret) {
  let i = 2;
  while (i + 3 < b.length && b[i] === 0xFF) {
    const m = b[i + 1];
    if (m === 0xDA || m === 0xD9) break;
    if (m === 0xFF) { i += 1; continue; }
    const tek = (m >= 0xD0 && m <= 0xD7) || m === 0x01;
    const uz = tek ? 2 : 2 + ((b[i + 2] << 8) | b[i + 3]);
    ziyaret(m, i, uz);
    i += uz;
  }
  return i;
}

function exifYonu(b) {
  let yon = 1;
  jpegParcalari(b, (m, i) => {
    if (m !== 0xE1 || String.fromCharCode(b[i + 4], b[i + 5], b[i + 6], b[i + 7]) !== "Exif") return;
    try {
      const t = i + 10, le = b[t] === 0x49;
      const g = new DataView(b.buffer, b.byteOffset + t, b.length - t);
      const ifd = g.getUint32(4, le), n = g.getUint16(ifd, le);
      for (let k = 0; k < n; k++) {
        const e = ifd + 2 + k * 12;
        if (g.getUint16(e, le) === 0x0112) { const v = g.getUint16(e + 8, le); if (v >= 1 && v <= 8) yon = v; }
      }
    } catch (x) { /* bozuk EXIF: yön bilinmiyor, 1 kabul edilir */ }
  });
  return yon;
}

function jpegTemizle(b) {
  const parcalar = [b.subarray(0, 2)];
  const son = jpegParcalari(b, (m, i, uz) => { if (m !== 0xE1 && m !== 0xED) parcalar.push(b.subarray(i, i + uz)); });
  parcalar.push(b.subarray(son));
  return parcalar;
}

function pngTemizle(b) {
  const parcalar = [b.subarray(0, 8)], g = new DataView(b.buffer, b.byteOffset, b.byteLength);
  let i = 8;
  while (i + 8 <= b.length) {
    const uz = g.getUint32(i), tip = String.fromCharCode(b[i + 4], b[i + 5], b[i + 6], b[i + 7]);
    if (!["eXIf", "tEXt", "iTXt", "zTXt"].includes(tip)) parcalar.push(b.subarray(i, i + 12 + uz));
    i += 12 + uz;
    if (tip === "IEND") break;
  }
  return parcalar;
}

async function dosyaHazirla(dosya) {
  const b = new Uint8Array(await dosya.arrayBuffer());
  let parcalar = [b], yon = 1;
  if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) { yon = exifYonu(b); parcalar = jpegTemizle(b); }
  else if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) parcalar = pngTemizle(b);
  const url = await new Promise((coz, reddet) => {
    const r = new FileReader();
    r.onload = () => coz(r.result); r.onerror = reddet;
    r.readAsDataURL(new Blob(parcalar));
  });
  return { veri: url.slice(url.indexOf(",") + 1), yon };
}

async function gonderimHazirla() {
  const dosyalar = [];
  for (const s of secilenler) dosyalar.push({ ...(await dosyaHazirla(s.dosya)), not: s.not });
  return JSON.stringify({
    islem: "gonder", dosyalar,
    genel_not: $("genel-not").value,
    belge_turu: document.querySelector("input[name=belge_turu]:checked").value,
    kategori: $("kategori").value,
    sorunlar: [...document.querySelectorAll("input[name=sorunlar]:checked")].map(e => e.value),
    beklenen_metin: $("beklenen").value,
    denenen_model: $("denenen").value,
    dil,
    izin_egitim: $("izin-egitim").checked ? "evet" : "",
    izin_kvkk: $("izin-kvkk").checked ? "evet" : "",
    web: $("web").value,
    sure: Math.round(performance.now() - ACILIS),
  });
}

async function yukle(govde) {
  // Apps Script ön kontrol (preflight) isteğini desteklemez: basit istek olsun diye text/plain ve dinleyicisiz fetch
  let r;
  try {
    r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: govde });
  } catch (e) { throw new Error("ag"); }
  const g = await r.json().catch(() => ({}));
  if (!g.ok) throw new Error(g.hata || "bilinmeyen:" + r.status);
  return g;
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  mesajGizle();
  if (!secilenler.length) return mesajGoster("hata", t("hata").dosya_yok);
  if (!$("izin-egitim").checked || !$("izin-kvkk").checked) return mesajGoster("hata", t("hata").izin_gerekli);
  if (secilenler.reduce((a, s) => a + s.dosya.size, 0) > MAKS_TOPLAM_BAYT) return mesajGoster("hata", t("hata").dosya_cok_buyuk);

  const dugme = $("gonder-dugme"), cubuk = $("ilerleme");
  dugme.disabled = true;
  try {
    if (sunucuDurum !== "hazir" && !(await sunucuyuUyandir())) throw new Error("ag");
    cubuk.style.display = "block";
    dugme.textContent = t("kaydediliyor");
    const sonuc = await yukle(await gonderimHazirla());
    $("b-kayit").textContent = sonuc.kayit;
    $("b-kod").textContent = sonuc.silme_kodu;
    $("form").style.display = "none";
    $("basari").classList.add("acik");
    $("basari").scrollIntoView({ behavior: "smooth", block: "center" });
  } catch (err) {
    mesajGoster("hata", hataMetni(err.message));
  } finally {
    dugme.disabled = false;
    dugme.textContent = t("form.gonder");
    cubuk.style.display = "none";
  }
});

$("yeni").addEventListener("click", () => {
  secilenler.forEach(s => s.url && URL.revokeObjectURL(s.url));
  secilenler = [];
  $("form").reset();
  secenekleriCiz();
  dosyalariCiz();
  $("basari").classList.remove("acik");
  $("form").style.display = "";
  $("gonder").scrollIntoView({ behavior: "smooth" });
});

document.addEventListener("click", e => {
  const id = e.target.dataset?.kopya; if (!id) return;
  navigator.clipboard?.writeText($(id).textContent).then(() => {
    e.target.textContent = t("kopyalandi");
    setTimeout(() => e.target.textContent = t("kopyala"), 1500);
  });
});

  e.preventDefault();
  mesajGizle("sil-mesaj");
  const kayit = $("sil-kayit").value.trim(), kod = $("sil-kod").value.trim();
  if (!kayit || !kod) return mesajGoster("hata", t("sil.bos"), "sil-mesaj");
  $("sil-dugme").disabled = true;
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ islem: "sil", kayit, silme_kodu: kod }) });
    const g = await r.json().catch(() => ({}));
    if (!g.ok) throw new Error(g.hata || "bilinmeyen:" + r.status);
    mesajGoster("bilgi", t("sil.tamam").replace("{k}", kac(g.silindi)), "sil-mesaj");
    $("sil-form").reset();
  } catch (err) {
    mesajGoster("hata", hataMetni(err.message === "Failed to fetch" ? "ag" : err.message), "sil-mesaj");
  } finally {
    $("sil-dugme").disabled = false;
  }
});

// ===================== AYDINLATMA PANELİ =====================
function panel(acik) {
  $("panel").classList.toggle("acik", acik);
  $("perde").classList.toggle("acik", acik);
  $("panel").setAttribute("aria-hidden", String(!acik));
  document.body.classList.toggle("kilit", acik);
  if (acik) $("p-kapat").focus();
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-aydinlatma]")) { e.preventDefault(); panel(true); }
});
$("p-kapat").onclick = $("perde").onclick = () => panel(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") panel(false); });

// ===================== DESEN =====================
function desen(svg) {
  const W = 56, H = 64, yigin = [];
  const harita = [[3, 3, 3, 2, 1], [3, 4, 3, 2, 1], [2, 3, 4, 3, 2], [1, 2, 3, 2, 1], [0, 1, 2, 1, 0]];
  harita.forEach((satir, y) => satir.forEach((h, x) => { for (let z = 0; z < h; z++) yigin.push([x, y, z]); }));
  yigin.sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]) || a[2] - b[2]);
  const vurgu = new Set(["2,2,3", "1,1,3", "1,2,2", "2,1,3"]);
  svg.innerHTML = yigin.map(([x, y, z]) => {
    const px = 300 + (x - y) * W / 2, py = 120 + (x + y) * H / 4 - z * H / 2;
    const tur = vurgu.has(`${x},${y},${z}`) ? ((x + y) % 2 ? "kup-y" : "kup-l") : "kup-k";
    return `<use href="#${tur}" x="${px}" y="${py}" width="${W}" height="${H}"/>`;
  }).join("");
}
desen($("desen"));
metinleriYaz();
sunucuyuUyandir();
</script>
